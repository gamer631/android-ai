name: Build Android AI APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          accept-android-sdk-licenses: true
      - name: Install Android SDK components
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        run: gradle --no-daemon assembleDebug
      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk AndroidAI-debug.apk
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: AndroidAI-debug-apk
          path: AndroidAI-debug.apk
          retention-days: 30
      - name: Publish direct APK release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=android-ai-apk
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" AndroidAI-debug.apk --clobber
          else
            gh release create "$TAG" AndroidAI-debug.apk --title "Android AI Latest APK" --notes "Latest debug APK built automatically from main. For testing only."
          fi
